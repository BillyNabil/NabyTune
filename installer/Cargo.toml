[package]
name = "nabytune-setup"
version = "0.1.3"
edition = "2021"
license = "GPL-3.0-only"
publish = false
build = "build.rs"

# Not part of gpui-proto's build: this crate has its own lock file and target dir.
[workspace]

[[bin]]
name = "NabyTune-Setup"
path = "src/main.rs"

[dependencies]
miniz_oxide = "0.8"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
miniz_oxide = "0.8"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The build script deflates ~70 MB of payload; unoptimised that takes minutes.
[profile.release.build-override]
opt-level = 3
[profile.dev.build-override]
opt-level = 3

